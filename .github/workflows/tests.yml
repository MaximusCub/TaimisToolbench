name: tests

on:
  push:
    branches: [master]
  pull_request:
  # release.yml calls this workflow and gates publishing on it, so a tagged
  # build cannot ship without the suite passing first. A `branches:` filter
  # with no `tags:` key excludes tag refs entirely, so without this the
  # release path ran no tests at all.
  workflow_call:

# Without this, three pushes in a row leave six runs racing and the last one to
# finish wins the status rather than the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each check below passed on the commit that introduced it, so this job can
  # only ever go red on a regression. Every rule it enforces is stated in
  # CLAUDE.md or CONTRIBUTING.md and was, until now, enforced by prose alone.
  invariants:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ASCII-only .cs source
        shell: bash
        run: |
          # LC_ALL=C is load-bearing. In a UTF-8 locale PCRE runs in UTF mode,
          # where a byte that is not valid UTF-8 never matches [^\x00-\x7F] at
          # all - so the step caught a UTF-8 em-dash and a BOM but waved through
          # Windows-1252 curly quotes (0x93/0x94), the likeliest way non-ASCII
          # reaches a Windows C# repo. Byte mode matches on bytes and catches
          # all three. `env` because xargs execs grep directly, not via a shell.
          violations=$(git ls-files -z '*.cs' \
            | xargs -0 -r env LC_ALL=C grep -laP '[^\x00-\x7F]' || true)
          if [ -n "$violations" ]; then
            echo "CLAUDE.md requires ASCII-only .cs source. Represent runtime glyphs"
            echo "with escape sequences instead. Non-ASCII characters found in:"
            echo "$violations"
            exit 1
          fi

      - name: No em-dash in source or config
        shell: bash
        run: |
          # ref/ holds data generated from the GW2 API and the wiki, not authored
          # text, so item names there are outside the rule.
          #
          # Byte mode here too, for the reason above - but the pattern must be
          # the em-dash's UTF-8 bytes, not \x{2014}: under LC_ALL=C, PCRE rejects
          # a code point above 0xFF outright ("character code point value in
          # \x{} is too large", rc=2), and the `|| true` below would swallow
          # that into a step that silently passes forever.
          hits=$(git ls-files -z '*.cs' '*.csproj' '*.yml' '*.yaml' '*.json' '*.config' \
            | xargs -0 -r env LC_ALL=C grep -laP '\xE2\x80\x94' | grep -v '^ref/' || true)
          if [ -n "$hits" ]; then
            echo "CLAUDE.md forbids em-dashes in source and config. Use '-' or '--'."
            echo "Found in:"
            echo "$hits"
            exit 1
          fi

      - name: UI glyph escapes exist in the shipped font
        shell: bash
        run: |
          # The step above forces non-ASCII into \uXXXX escapes. Escaping is
          # not rendering: Blish ships one text face, and Menomonia carries
          # 226 codepoints. Anything else draws nothing AND advances zero
          # pixels, so it is invisible to the eye, to MeasureString and to
          # every layout assertion the suite has - which is how a pin toggle
          # whose two states were a filled and a hollow circle shipped with
          # no visual state at all (KNOWN-ISSUES #64).
          #
          # The module now also ships a font of its own, ref/glyphs.fnt, so
          # "the shipped font" is two fonts and the check has to know WHICH
          # one a string is drawn in. It cannot: a codepoint in a .cs file
          # says nothing about the Font its Label was given. So the rule is
          # scoped instead of widened. Every codepoint from our own atlas is
          # named exactly once, in Services/UiGlyphs.cs, and every seat that
          # draws one goes through that constant - which is also the file
          # whose doc comment says which font it belongs to. Allowing our
          # PUA codepoints anywhere else would let one be pasted into a
          # string that a Menomonia Label draws, and it would vanish exactly
          # the way the original five did.
          #
          # Module source only: tests and tools carry deliberately odd text,
          # and ref/ is API and wiki data rather than authored strings.
          # Whole-line comments are skipped, so a comment may still name a
          # codepoint the font lacks in order to warn about it.
          python3 - <<'PY'
          import re, subprocess, sys

          allowed = set()
          for line in open('docs/font-codepoints.txt', encoding='utf-8'):
              line = line.split('#')[0].strip()
              if line:
                  allowed.add(int(line, 16))

          # The module's own atlas, read from the artifact the .bhm ships
          # rather than from a list beside it, so a regenerated font and this
          # gate cannot disagree. Regenerate with tools/build-glyph-font.py.
          GLYPH_OWNER = 'Services/UiGlyphs.cs'
          shipped = set()
          for line in open('ref/glyphs.fnt', encoding='ascii'):
              if line.startswith('char '):
                  for token in line.split():
                      if token.startswith('id='):
                          shipped.add(int(token[3:]))

          # Empty, and it should stay that way: the Ranker's three broken
          # glyphs - the last waived entries - are gone, replaced by the
          # game's own art. A waiver is a promise to come back, and this one
          # was kept. Entries here are checked for staleness below.
          waived = set()

          files = subprocess.run(
              ['git', 'ls-files', 'Models/*.cs', 'Services/*.cs', 'Views/*.cs',
               'Contracts/*.cs', 'Properties/*.cs', 'Module.cs'],
              capture_output=True, text=True, check=True).stdout.split()
          escape = re.compile(r'\\u([0-9a-fA-F]{4})|\\U([0-9a-fA-F]{8})')
          bad = []
          seen = set()
          named = set()
          for f in files:
              for n, line in enumerate(open(f, encoding='utf-8'), 1):
                  if line.lstrip().startswith(('//', '*', '/*')):
                      continue
                  for m in escape.finditer(line):
                      cp = int(m.group(1) or m.group(2), 16)
                      if cp in allowed:
                          continue
                      if f == GLYPH_OWNER and cp in shipped:
                          named.add(cp)
                          continue
                      seen.add((f, cp))
                      if (f, cp) not in waived:
                          bad.append(f'{f}:{n}: U+{cp:04X}')
          if bad:
              print('UI strings use codepoints no shipped font can draw.')
              print('They will render as nothing at all. Use a codepoint from')
              print('docs/font-codepoints.txt, a constant from')
              print(f'{GLYPH_OWNER}, a texture, or a drawn primitive:')
              print('\n'.join(bad))
              sys.exit(1)
          unnamed = sorted(shipped - named)
          if unnamed:
              print(f'ref/glyphs.fnt carries glyphs {GLYPH_OWNER} does not name.')
              print('Every glyph in the atlas costs licence surface and is a')
              print('vocabulary nothing re-measures when it drifts. Name it or')
              print('drop it from tools/build-glyph-font.py and regenerate:')
              for cp in unnamed:
                  print(f'  U+{cp:04X}')
              sys.exit(1)
          stale = sorted(waived - seen)
          if stale:
              print('Waivers for glyphs that are no longer in the source.')
              print('Delete them from this step:')
              for f, cp in stale:
                  print(f'  {f} U+{cp:04X}')
              sys.exit(1)
          print(f'{len(files)} module sources; every glyph escape is one of the '
                f'{len(allowed)} Menomonia carries or one of the {len(shipped)} '
                f'in ref/glyphs.fnt, and every one of those is named.')
          PY

      - name: Tests stay free of Blish HUD and Gw2Sharp
        shell: bash
        run: |
          # The test project references the module, so every Blish type is already
          # on the test compiler's path: without this check a stray using would
          # compile and pass. Comment lines are allowed, since several tests
          # explain which Blish-bound seam they were written to avoid.
          hits=$(git ls-files -z 'tests/*.cs' | xargs -0 -r grep -nE '(Blish_HUD|Gw2Sharp)' \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "Tests must never reference Blish HUD or Gw2Sharp:"
            echo "$hits"
            exit 1
          fi
          pkgs=$(git ls-files -z 'tests/*.csproj' | xargs -0 -r grep -inE 'Blish|Gw2Sharp' || true)
          if [ -n "$pkgs" ]; then
            echo "Test projects must not reference Blish HUD or Gw2Sharp:"
            echo "$pkgs"
            exit 1
          fi

      - name: csproj Compile list matches disk
        shell: bash
        run: |
          # The legacy csproj lists every source file by hand (CONTRIBUTING.md
          # explains why it stays that way). An unregistered .cs compiles nowhere
          # and fails nothing, so the omission is invisible without this check.
          grep -oP '(?<=<Compile Include=")[^"]+' TaimisToolbench.csproj \
            | tr '\\' '/' | sort > /tmp/compile-list.txt
          git ls-files 'Models/*.cs' 'Services/*.cs' 'Views/*.cs' 'Contracts/*.cs' \
            'Properties/*.cs' 'Module.cs' | sort > /tmp/source-files.txt
          drift=$(comm -3 /tmp/compile-list.txt /tmp/source-files.txt)
          if [ -n "$drift" ]; then
            echo "TaimisToolbench.csproj and disk disagree."
            echo "Left column: in the csproj but not on disk."
            echo "Right column: on disk but missing a <Compile Include> entry."
            echo "$drift"
            exit 1
          fi

      - name: Every stack records what is fitted into it and what it wears
        shell: bash
        run: |
          # The snapshot builds a row per stack from five account sources,
          # and a row that drops its socketed ids or its skin loses them for
          # good: the tooltip and the Snapshot hover read the stored row,
          # never the API. Equipped gear reached the snapshot after the bag
          # sources already recorded sockets, and its rows were built
          # without them. `item.Id` is what marks a row built from an
          # account API item; material storage builds from `mat` and
          # carries neither field.
          f=Services/Gw2AccountSnapshotService.cs
          rows=$(grep -c 'ItemId = item.Id,' "$f" || true)
          ups=$(grep -c 'Upgrades = SocketedIds(item.Upgrades),' "$f" || true)
          infs=$(grep -c 'Infusions = SocketedIds(item.Infusions),' "$f" || true)
          skins=$(grep -c 'SkinId = SkinIdOf(item.Skin),' "$f" || true)
          if [ "$rows" -lt 1 ] || [ "$ups" -ne "$rows" ] || [ "$infs" -ne "$rows" ] \
              || [ "$skins" -ne "$rows" ]; then
            echo "$f builds $rows rows from an account API item, but records"
            echo "Upgrades on $ups of them, Infusions on $infs and SkinId on $skins."
            echo "Every such row must carry all three, the way the bank rows do."
            grep -n 'ItemId = item.Id,' "$f"
            exit 1
          fi
          echo "$rows rows built from an account item; all record sockets and skin."

      - name: Live docs cite source paths that exist
        shell: bash
        run: |
          # dev/ and docs/research are dated point-in-time records, frozen by
          # policy, so a path that moved after they were written is not a
          # regression. Paths written with an elision are illustrative.
          live=$(git ls-files '*.md' | grep -vE '^(dev/|docs/research/)')
          missing=""
          for path in $(grep -rhoP '`(Views|Services|Models|Contracts|tools)/[^`*]+\.cs`' $live \
            | tr -d '`' | grep -v '\.\.\.' | sort -u || true); do
            if [ ! -f "$path" ]; then
              missing="$missing $path"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Live docs cite source files that do not exist:$missing"
            exit 1
          fi

      - name: Source cites markdown paths that exist
        shell: bash
        run: |
          # The mirror of the check above. Comments used to cite design docs by
          # bare filename - "design-plan-notes.md", "decision-map.md" - and nine
          # of those had never been committed at all, so a reader chasing the
          # rationale for shipped behaviour found nothing. Only comment lines are
          # scanned, so a future code path that writes a .md is not a citation.
          python3 - <<'PY'
          import os, re, subprocess, sys

          files = subprocess.run(['git', 'ls-files', '*.cs'], capture_output=True,
                                 text=True, check=True).stdout.split()
          token = re.compile(r'[A-Za-z0-9_][A-Za-z0-9_./-]*\.md')
          bad = []
          for f in files:
              for n, line in enumerate(open(f, encoding='utf-8'), 1):
                  s = line.lstrip()
                  if not (s.startswith('//') or s.startswith('*')):
                      continue
                  for m in token.finditer(s):
                      if not os.path.exists(m.group(0)):
                          bad.append(f'{f}:{n}: {m.group(0)}')
          if bad:
              print('Source cites markdown files that do not exist. Cite by')
              print('repo-relative path, or state the fact instead of pointing at it:')
              print('\n'.join(bad))
              sys.exit(1)
          print('Every markdown citation in .cs comments resolves.')
          PY

      - name: "Every KNOWN-ISSUES #N cited from source resolves"
        shell: bash
        run: |
          # Source cites the tracker over 200 times. Until 2026-08-25 it did so
          # in six different shapes, only one of which resolved to anything;
          # this is what keeps the surviving shape honest.
          python3 - <<'PY'
          import re, subprocess, sys

          tracker = open('docs/KNOWN-ISSUES.md', encoding='utf-8').read()
          headings = set()
          for m in re.finditer(r'^### (\d+)\.', tracker, re.M):
              headings.add(int(m.group(1)))
          for m in re.finditer(r'^### Items (\d+)-(\d+):', tracker, re.M):
              headings.update(range(int(m.group(1)), int(m.group(2)) + 1))

          files = subprocess.run(['git', 'ls-files', '*.cs'], capture_output=True,
                                 text=True, check=True).stdout.split()
          # A citation may wrap onto the next comment line, so comment markers and
          # newlines are folded away before the numbers are read off.
          cite = re.compile(r'KNOWN-ISSUES\s*((?:#\d+[a-z]?(?:\.\d+)?[/, ]*)+)')
          bad = []
          for f in files:
              text = open(f, encoding='utf-8').read()
              flat = re.sub(r'\n\s*(?:///|//|\*)', ' ', text)
              for m in cite.finditer(flat):
                  for n in re.findall(r'#(\d+)', m.group(1)):
                      if int(n) not in headings:
                          bad.append(f'{f}: KNOWN-ISSUES #{n}')
          if bad:
              print('Source cites KNOWN-ISSUES entries that have no heading:')
              print('\n'.join(sorted(set(bad))))
              sys.exit(1)
          print(f'{len(headings)} catalog entries; every cited number resolves.')
          PY

      - name: KNOWN-ISSUES stays under its rotation threshold
        shell: bash
        run: |
          # The previous threshold was ~100KB, prose-only, and set below the
          # file's own post-rotation floor - true the day it was written, so it
          # could never fire. 250KB is headroom above the measured 72KB floor.
          bytes=$(wc -c < docs/KNOWN-ISSUES.md)
          if [ "$bytes" -gt 256000 ]; then
            echo "docs/KNOWN-ISSUES.md is $bytes bytes, past the 250KB threshold."
            echo "Milestone records belong in dev/records/, one file per branch;"
            echo "if they are already there, the ledger is due a consolidation."
            exit 1
          fi
          echo "docs/KNOWN-ISSUES.md: $bytes bytes."

      - name: Files stay within their line budgets
        shell: bash
        run: |
          # A ratchet, not a metric. docs/file-budgets.txt explains itself;
          # this is the half that has teeth. See the CraftingPlanView regrowth
          # it was written for.
          fail=0
          while read -r path budget; do
            case "$path" in ''|\#*) continue ;; esac
            if [ ! -f "$path" ]; then
              echo "budget entry for a path that no longer exists: $path"
              echo "  a rename has to move its budget with it, not drop it."
              fail=1
              continue
            fi
            actual=$(wc -l < "$path")
            if [ "$actual" -gt "$budget" ]; then
              echo "$path: $actual lines, budget $budget (+$((actual - budget)))"
              fail=1
            fi
          done < docs/file-budgets.txt
          if [ "$fail" -ne 0 ]; then
            echo "Raise the budget in docs/file-budgets.txt in this same commit and"
            echo "say why in the message, or put the growth somewhere it belongs."
            exit 1
          fi
          echo "Every budgeted file is within its entry."

      - name: Comment blocks stay within their pinned counts
        shell: bash
        run: |
          # A ratchet, not a metric. docs/comment-budgets.txt explains itself;
          # this is the half that has teeth. The line-budget step above counts
          # total lines, which makes a 50-line comment indistinguishable from
          # 50 lines of code - so the August comment sweep could land three
          # times and leave the long blocks in place with nothing to notice.
          python3 tools/comment-budgets.py --check

      - name: No doc comment left stranded on the wrong member
        shell: bash
        run: |
          # Insert a member between a doc comment and the method it describes
          # and the comment stays where it was: attached to whatever now
          # follows it, with the inserted member undocumented. The compiler
          # says nothing - a /// run is attached positionally, and a second
          # <summary> inside one is not an error, just a doc build that picks
          # one of them. Two <summary> tags in a single contiguous /// run is
          # the signature, and it is mechanical rather than authorial: four
          # instances were found on 2026-08-28 across three authors' work,
          # one of them (CraftingPlanView) already on master.
          python3 - <<'PY'
          import subprocess, sys

          files = subprocess.run(['git', 'ls-files', '*.cs'], capture_output=True,
                                 text=True, check=True).stdout.split()
          bad = []
          for f in files:
              start, count = 0, 0
              # The sentinel closes a run that reaches end of file.
              for n, line in enumerate(open(f, encoding='utf-8').read().splitlines() + [''], 1):
                  if line.lstrip().startswith('///'):
                      if count == 0:
                          start = n
                      # Counted per tag, not per line: one slip put both
                      # summaries on the same physical line.
                      count += line.count('<summary>')
                      continue
                  if count > 1:
                      bad.append('%s:%d: %d <summary> tags in one /// run' % (f, start, count))
                  count = 0
          if bad:
              print('A doc comment is stranded on a member it does not describe.')
              print('Move it back above the member it was written for; the member')
              print('now carrying it needs its own summary or none:')
              print('\n'.join(bad))
              sys.exit(1)
          print('%d sources; every /// run documents exactly one member.' % len(files))
          PY

      - name: Saved plans from older builds still load
        shell: bash
        run: |
          # The corpus half of the compatibility gate. The loading half is
          # PlanCompatibilityFixtureTests, which needs a Windows build; this
          # runs here, in seconds, and catches the mistake that actually
          # happens - bumping a schema version and shipping without leaving
          # behind the file that proves the NEXT build can still read what
          # this one wrote. tests/shared/plan_fixtures/README.md is the
          # workflow; the one-liner is `dotnet test tests/TaimisToolbench.Tests`,
          # which captures a missing fixture from the real serializer and
          # fails telling you to git add it.
          python3 - <<'PY'
          import json, os, re, sys

          FIXTURES = 'tests/shared/plan_fixtures'

          def current(path, type_name, const):
              text = open(path, encoding='utf-8').read()
              body = text.split('class ' + type_name, 1)[1]
              return int(re.search(r'public const int %s = (\d+);' % const, body).group(1))

          families = [
              ('plan-v', current('Models/PersistedPlan.cs', 'PersistedPlan', 'CurrentSchemaVersion')),
              ('plan-history-index-v',
               current('Models/PlanHistoryEntry.cs', 'PlanHistoryIndex', 'CurrentSchemaVersion')),
          ]

          bad = []
          checked = 0

          # The one constant in the module whose value IS the amount of user
          # data a release destroys. PlanHistoryStore reads the range
          # [MinimumReadableSchemaVersion, CurrentSchemaVersion] and empties
          # the index outside it, so raising this floor discards every row a
          # user wrote at a version below it - up to 200 saved plans, with no
          # prompt and no undo. It is pinned here as well as in
          # PlanHistorySchemaMemberSetTests so the failure is visible without
          # a Windows build, and so a bump cannot ride in on a merge.
          floor = current('Models/PlanHistoryEntry.cs', 'PlanHistoryIndex',
                          'MinimumReadableSchemaVersion')
          if floor != 1:
              bad.append(
                  'PlanHistoryIndex.MinimumReadableSchemaVersion is %d, not 1 - every '
                  'user who wrote history below that version loses all of it on '
                  'upgrade. If that is genuinely intended, change this step in the '
                  'same commit and say why in the message.' % floor)
          for prefix, shipped in families:
              for version in range(1, shipped + 1):
                  name = '%s%d.json' % (prefix, version)
                  if not os.path.exists(os.path.join(FIXTURES, name)):
                      bad.append('%s/%s is missing, but version %d shipped.' % (FIXTURES, name, version))

          # Every file in the directory, variants included: a fixture whose
          # name claims a version its bytes do not carry would be checked
          # against the wrong contract and quietly prove nothing.
          for name in sorted(os.listdir(FIXTURES)):
              if not name.endswith('.json'):
                  continue
              stamp = re.search(r'-v(\d+)', name)
              if stamp is None:
                  bad.append('%s/%s does not name the version it pins.' % (FIXTURES, name))
                  continue
              claimed = int(stamp.group(1))
              document = json.load(open(os.path.join(FIXTURES, name), encoding='utf-8'))
              checked += 1
              if document.get('SchemaVersion') != claimed:
                  bad.append('%s/%s is stamped SchemaVersion %r, not %d.'
                             % (FIXTURES, name, document.get('SchemaVersion'), claimed))
              rows = document.get('RequestItems')
              if name.startswith('plan-history-index-v'):
                  rows = [r for entry in document.get('Entries', []) for r in entry.get('RequestItems', [])]
              if not rows:
                  bad.append('%s/%s carries no request at all, so it can prove nothing.'
                             % (FIXTURES, name))
                  continue
              for row in rows:
                  if 'ItemId' not in row or 'Quantity' not in row:
                      bad.append('%s/%s has a request row missing ItemId/Quantity.' % (FIXTURES, name))

          if bad:
              print('The saved-plan compatibility corpus is incomplete.')
              print('A plan written by any shipped build must still restore its request in')
              print('every later build - these fixtures are what makes that checkable:')
              for line in bad:
                  print('  ' + line)
              print('Run `dotnet test tests/TaimisToolbench.Tests` to capture a missing')
              print('fixture from the real serializer, then git add it in the same commit')
              print('as the bump. See %s/README.md.' % FIXTURES)
              sys.exit(1)
          print('%d saved-plan fixtures; every shipped schema version has one.' % checked)
          PY

      - name: Public surface stays within its pinned count
        shell: bash
        run: |
          # A ratchet, not a metric. docs/public-surface.txt explains itself;
          # this is the half that has teeth. Written after 10 public types
          # landed in the weeks after the internal-flip, unnoticed because
          # the convention was prose-only. Top-level means indented exactly
          # one namespace level: the module has no file-scoped namespaces
          # and no tab indentation, so 4 spaces is the committed shape, and
          # a deeper indent is a nested type inside an internal owner, which
          # the assembly does not export.
          pinned=$(grep -v '^#' docs/public-surface.txt | grep -m1 .)
          decls=$(git ls-files -z 'Models/*.cs' 'Services/*.cs' 'Views/*.cs' \
              'Contracts/*.cs' 'Properties/*.cs' 'Module.cs' \
            | xargs -0 -r grep -nE '^    public (sealed |static |abstract |partial )*(class|struct|interface|enum|record|delegate) ' || true)
          actual=$(printf '%s' "$decls" | grep -c . || true)
          if [ "$actual" -gt "$pinned" ]; then
            echo "The module declares $actual public top-level types; the pin is $pinned."
            echo "The module's default is internal. Make the new type internal, or"
            echo "raise the pin in docs/public-surface.txt in this same commit and"
            echo "say in the message why the type earned a public seam."
            echo "$decls"
            exit 1
          fi
          if [ "$actual" -lt "$pinned" ]; then
            echo "NOTE: $actual public top-level types, pin is $pinned - lower the pin"
            echo "in docs/public-surface.txt to bank the reduction."
          fi
          echo "Public top-level types: $actual (pin: $pinned)."

      - name: Every item icon names its tier and what it shows on hover
        shell: bash
        run: |
          # Reported in game: item icons on the Snapshot tab drew the wrong
          # rarity border colours, and there was no single call that every
          # surface had to go through to get them right.
          # There was one - IconControls.CreateItemIcon - but its size and
          # border were DEFAULTED parameters, so the standard was opt-in and
          # eleven call sites each chose their own numbers. The defaults are
          # gone and the tier is now a required ItemIconTier; this is what
          # stops the pre-tier overloads growing a twelfth caller while the
          # two below wait for their branches to land.
          #
          # The tooltip was the same hole one parameter along: an optional
          # trailing string plus a separate opt-in stamping call, so an icon
          # that answered nothing on hover looked exactly like one that had
          # decided against answering. Plan History shipped with a whole tab
          # of them. It is now a required ItemIconTooltip: a silent icon has
          # to name its reason through ItemIconTooltip.None(ItemIconSilence.X).
          #
          # SCOPE is the other half. Also reported in game: the whole Ranker
          # row answered with the item tooltip, including its empty space,
          # when only the icon should. The
          # module used to stamp the row panel and every label on it,
          # precisely BECAUSE Blish resolves on the deepest control and
          # never bubbles so the gaps otherwise answered nothing. The gaps
          # SHOULD answer nothing. ItemIconTooltip therefore exposes no seam
          # that takes a Label or a bare Control - only the icon tree it
          # builds and a Panel overlaid on that icon - and this step pins
          # that member list so widening it back out is a visible diff here
          # as well as there.
          #
          # The COMPILER is what stops the argument being omitted, and
          # ItemIconTooltip's private constructor is what stops one being
          # built without a factory. What is left for this step is the
          # laundering: a `default` slid into the slot, or an intent
          # forwarded in from a parameter so no reviewer of the call site
          # ever sees which one it is. So it asks two things of every file
          # that builds a framed item icon - no call passes `default`, and
          # the file names at least one ItemIconTooltip factory itself.
          #
          # Scope is the FRAMED item icon. CreateUnframedIcon and
          # CreateAssetIcon are the two documented non-item paths (a coin
          # denomination, a tooltip's own inline art) and keep their plain
          # string; see IconControls' class comment.
          python3 - <<'PY'
          import re, subprocess, sys

          # Each entry is a file that still calls a pre-tier overload, and the
          # branch that owns it. Removing an entry is the act of the commit
          # that migrates its call; adding one needs a reason in the message.
          ALLOWED = {
              'Views/RankerTabContent.cs': 'the Ranker rarity branch owns this file',
              'Views/Rendering/IconNameRowHelpers.cs': 'carries the legacy shim for the row builder above',
          }

          # The ONE file that may pass an ItemIconTooltip it did not name:
          # the shared row builder, which forwards the intent its own caller
          # was required to name. Nothing else forwards one.
          FORWARDS = {
              'Views/Rendering/IconNameRowHelpers.cs':
                  'forwards the intent its own caller named',
          }
          # CreateItemIconDeferredArt is the same framed item icon with its
          # picture request held back, so it is gated the same way. Without
          # this entry the Snapshot tab's ~960 icons would leave the gate
          # entirely, which is the tab the gate was written for.
          CALLS = ('IconControls.CreateItemIcon(',
                   'IconControls.CreateItemIconDeferredArt(',
                   'IconNameRowHelpers.CreateIconAndEllipsizedName(')

          files = subprocess.run(
              ['git', 'ls-files', 'Models/*.cs', 'Services/*.cs', 'Views/*.cs',
               'Contracts/*.cs', 'Properties/*.cs', 'Module.cs'],
              capture_output=True, text=True, check=True).stdout.split()

          def arguments(text, open_paren):
              # Walk to the matching close paren so a call broken over several
              # lines is read whole. An unbalanced walk returns None rather
              # than the rest of the file: the tail would be near-certain to
              # contain the word ItemIconTier somewhere and would turn this
              # step into a silent pass.
              depth, i = 0, open_paren
              while i < len(text):
                  if text[i] == '(':
                      depth += 1
                  elif text[i] == ')':
                      depth -= 1
                      if depth == 0:
                          return text[open_paren + 1:i]
                  i += 1
              return None

          def split_arguments(args):
              # Top-level split: a nested call's own commas are not ours.
              parts, depth, start = [], 0, 0
              for i, ch in enumerate(args):
                  if ch in '([':
                      depth += 1
                  elif ch in ')]':
                      depth -= 1
                  elif ch == ',' and depth == 0:
                      parts.append(args[start:i].strip())
                      start = i + 1
              parts.append(args[start:].strip())
              return parts

          def last_argument(args):
              return split_arguments(args)[-1]

          bad, silent, unused = [], [], []
          seen = set()
          for f in files:
              text = open(f, encoding='utf-8').read()
              names_a_factory = 'ItemIconTooltip.' in text
              for marker in CALLS:
                  for m in re.finditer(re.escape(marker), text):
                      args = arguments(text, m.end() - 1)
                      line = text.count('\n', 0, m.start()) + 1
                      if args is None or 'ItemIconTier.' not in args:
                          seen.add(f)
                          if f not in ALLOWED:
                              bad.append(f'{f}:{line}')
                      if f in FORWARDS:
                          continue
                      tail = '' if args is None else last_argument(args)
                      if args is None or tail.startswith('default') or not names_a_factory:
                          silent.append(f'{f}:{line}')

          for path, why in sorted(ALLOWED.items()):
              if path not in files:
                  bad.append(f'{path}: allow-listed but not in the tree ({why})')
              elif path not in seen:
                  unused.append(f'{path} ({why})')

          for path, why in sorted(FORWARDS.items()):
              if path not in files:
                  silent.append(f'{path}: forward-listed but not in the tree ({why})')

          # A hard-coded null stat source on ForItem composes a header-only
          # hover: an icon and a name, and nothing the game's own item
          # tooltip says. Every other call site passes a CONDITIONAL null -
          # "no stat block for THIS id, on this surface" - which is a
          # different statement and stays allowed. No file is exempt: the
          # last one that was, Views/PlanHistoryTabContent.cs, is what the
          # owner saw as "just an icon and name".
          statless = []
          for f in files:
              text = open(f, encoding='utf-8').read()
              for m in re.finditer(re.escape('ItemIconTooltip.ForItem('), text):
                  args = arguments(text, m.end() - 1)
                  if args is None:
                      continue
                  parts = split_arguments(args)
                  line = text.count('\n', 0, m.start()) + 1
                  if len(parts) > 1 and parts[1] == 'null':
                      statless.append(f'{f}:{line}')

          # The stamping seams, pinned by name and by parameter type. A new
          # one, or one widened to Control/Label, is how the whole-row
          # stamping would come back.
          SEAMS = {
              'internal void StampOnIconOverlay(Panel overlay)',
              'internal void StampOnIconTree(Control iconTree)',
          }
          intent = open('Views/Rendering/ItemIconTooltip.cs', encoding='utf-8').read()
          declared = set(re.findall(r'^        (internal void Stamp\w+\([^)]*\))', intent, re.M))
          if declared != SEAMS:
              print('ItemIconTooltip\'s stamping seams changed.')
              print('  pinned:   ' + '; '.join(sorted(SEAMS)))
              print('  declared: ' + '; '.join(sorted(declared)))
              print('An item tooltip is carried by the item ICON and nothing else - no')
              print('name label, no row panel, no value cell. Widening this set puts the')
              print('hover back on dead space; if that is genuinely intended, change the')
              print('pin here in the same commit and say why in the message.')
              silent.append('Views/Rendering/ItemIconTooltip.cs: seam set')

          # The factory set, pinned the same way and for the same reason.
          # Naming() - a subject's name and nothing else, no icon, no wallet
          # balance, no prose - was the one hatch through which an item or a
          # currency could reach the screen as a bare line, and it was what
          # every currency hover in the module used to be. It was deleted
          # with its last caller. An ITEM takes ForItem/Composed and a WALLET
          # CURRENCY takes ForCurrency, decided by the id space the call site
          # drew the icon from and never by the name: "Gaeting Crystal" is
          # wallet currency 77 AND item 104026, one good in two id spaces.
          FACTORIES = {'ForItem', 'Composed', 'ForCurrency', 'None'}
          factories = set(re.findall(
              r'^        internal static ItemIconTooltip (\w+)\(', intent, re.M))
          if factories != FACTORIES:
              print('ItemIconTooltip\'s factory set changed.')
              print('  pinned:   ' + '; '.join(sorted(FACTORIES)))
              print('  declared: ' + '; '.join(sorted(factories)))
              print('A new factory is a new thing an icon is allowed to say on hover.')
              print('If it is genuinely a fifth kind, change the pin here in the same')
              print('commit and say why; a factory that yields a bare name is not one.')
              silent.append('Views/Rendering/ItemIconTooltip.cs: factory set')

          if bad:
              print('These item icons are built without a named ItemIconTier:')
              print('\n'.join(sorted(bad)))
              print('Pass a tier from Services/ItemIconTiers.cs. Every framed item icon')
              print('in the module traces to one; a new size is a new named tier there.')
          if silent:
              print('These item icons are built without a named ItemIconTooltip:')
              print('\n'.join(sorted(silent)))
              print('Pass one from Views/Rendering/ItemIconTooltip.cs: ForItem/Composed for')
              print('an item, ForCurrency for a wallet currency, or None(ItemIconSilence.X)')
              print('to say out loud that this icon shows nothing and why.')
          if statless:
              print('These item hovers are composed with no stat source at all, so they')
              print('can only ever be an icon and a name:')
              print('\n'.join(sorted(statless)))
              print('Pass the surface\'s own session stat lookup. A null that depends on')
              print('the row (no id, no accessor on this surface) is a conditional and is')
              print('not what this asks about.')
          if bad or silent or statless:
              sys.exit(1)
          if unused:
              print('NOTE: these files no longer call a pre-tier overload - drop them')
              print('from this step\'s allow-list to bank the migration:')
              print('\n'.join(sorted(unused)))
          print('Every item icon names its tier and its hover.')
          PY

      - name: A currency icon's frame is a border, not a background
        shell: bash
        run: |
          # It shipped once: PR #232 gave every currency icon a filled frame
          # plate, and currency art is mostly transparent, so the plate drew
          # as a grey BACKGROUND. Only "a gentle grey border" was ever asked
          # for. Item icons keep the plate - their full-bleed bag-slot art
          # hides it - so the guard is that a fill is reachable ONLY on the
          # branch where ItemIconFrame.IsOutline is false, and that the
          # outline frame itself paints no background at all.
          # IconFrameGeometryTests pins what the ring covers; this pins that
          # nothing paints under it.
          python3 - <<'PY'
          import sys

          src = open('Views/Rendering/IconControls.cs', encoding='utf-8').read()
          fail = []

          parts = src.split('private static Panel CreateFrame(', 1)
          if len(parts) != 2:
              fail.append('IconControls has no CreateFrame - the frame builder was renamed.')
          else:
              body = parts[1].split('\n        }', 1)[0]
              fills = body.count('BackgroundColor')
              if fills != 1:
                  fail.append(
                      'CreateFrame assigns a background %d times; exactly one - the '
                      'item plate - is allowed. A second is how the currency fill '
                      'came back.' % fills)
              if 'frame.IsOutline' not in body:
                  fail.append('CreateFrame no longer branches on ItemIconFrame.IsOutline.')
              if 'OutlineFramePanel' not in body:
                  fail.append('CreateFrame no longer draws the currency border as a ring.')

          ring = open('Views/Rendering/OutlineFramePanel.cs', encoding='utf-8').read()
          if 'BackgroundColor' in ring:
              fail.append('OutlineFramePanel paints a background; it exists not to.')

          if 'internal bool IsOutline' not in open(
                  'Views/Rendering/RarityColors.cs', encoding='utf-8').read():
              fail.append('ItemIconFrame no longer states whether its frame is a ring.')

          if fail:
              print('\n'.join(fail))
              sys.exit(1)
          print('The currency frame is still a ring with nothing painted inside it.')
          PY

      - name: The Total Cost table registers its scroll anchors
        shell: bash
        run: |
          # A renderer takes a Blish Control, and tests reference no UI code
          # (repo invariant), so no unit test can call the renderer. Delete
          # the two RegisterScrollAnchor calls and every test stays green
          # while a re-solve that changes the table's row count drags the
          # whole tree under the reader's cursor. ScrollAnchorMathTests pins
          # the arithmetic those keys feed; this pins that the renderer
          # hands them over, and that the view still spells the two key
          # prefixes those tests carry as literals.
          python3 - <<'PY'
          import sys

          def squeezed(path):
              return ''.join(open(path, encoding='utf-8').read().split())

          renderer = squeezed('Views/Rendering/SummarySectionRenderer.cs')
          view = squeezed('Views/CraftingPlanView.cs')
          fail = []

          for key in ('NonCoinGroupAnchorKey', 'NonCoinRowAnchorKey'):
              call = 'RegisterScrollAnchor(SummarySectionLayoutMath.%s(' % key
              if call not in renderer:
                  fail.append(
                      'SummarySectionRenderer no longer registers a scroll anchor '
                      'keyed by SummarySectionLayoutMath.%s.' % key)

          if '_registerScrollAnchor(key,control)' not in renderer:
              fail.append(
                  'SummarySectionRenderer.RegisterScrollAnchor no longer forwards to '
                  'the delegate the view hands it.')

          for prefix in ('"section:"', '"node:"'):
              if prefix not in view:
                  fail.append(
                      'CraftingPlanView no longer spells the %s anchor key prefix that '
                      'ScrollAnchorMathTests pins as a literal.' % prefix)

          if fail:
              print('\n'.join(fail))
              sys.exit(1)
          print('The Total Cost table still registers its scroll anchors.')
          PY

      - name: The snapshot coin row seats its digits on the caption baseline
        shell: bash
        run: |
          # MainView is Blish-bound, so CoinSegmentMathTests reproduces this
          # expression and the caption y it reads instead of calling it.
          # That makes the test a mirror: change the view alone and it stays
          # green. Until the seat moves into a Blish-free class the test can
          # call, this step is what fails on that change.
          python3 - <<'PY'
          import sys

          view = ''.join(open('Views/MainView.cs', encoding='utf-8').read().split())
          fail = []

          if 'privateconstintCoinCaptionY=2;' not in view:
              fail.append(
                  'MainView.CoinCaptionY is no longer 2. CoinSegmentMathTests carries '
                  'that number as its own CaptionY constant; update it too.')

          seat = ('intdigitY=TypeRampMetrics.BaselineAlignedY(TypeRampMetrics.CoinDigitInk,'
                  'CoinCaptionY+TypeRampMetrics.BodyInk.BaselineY);')
          if seat not in view:
              fail.append(
                  'MainView no longer seats the coin digits with BaselineAlignedY over '
                  'CoinDigitInk and the caption baseline. CoinSegmentMathTests.'
                  'TheCoinSeat_HoldsItsRow_WhenTheDigitsDropOneRampStep reproduces that '
                  'expression; update it too.')

          if fail:
              print('\n'.join(fail))
              sys.exit(1)
          print('The coin row seat still matches the one CoinSegmentMathTests pins.')
          PY

      - name: Module source cites no out-of-repo spec sections
        shell: bash
        run: |
          # "spec section N.n" citations point at a document that is not in
          # this repository and never was (KNOWN-ISSUES #42 records the
          # sweep); the pattern regrew twice after being cleaned because
          # nothing checked for it. Cite KNOWN-ISSUES or a docs/ file that
          # actually carries the rationale, or inline the sentence. The
          # digit keeps legitimate phrasing alive: "the spec", a repo doc's
          # own "Section 4.3", and the CoinSegmentSpec/pill-spec objects
          # never match "spec section <digit>".
          hits=$(git ls-files -z 'Models/*.cs' 'Services/*.cs' 'Views/*.cs' \
              'Contracts/*.cs' 'Properties/*.cs' 'Module.cs' \
            | xargs -0 -r grep -niE 'spec section [0-9]' || true)
          if [ -n "$hits" ]; then
            echo "Module source cites spec sections of a document this repo does not carry:"
            echo "$hits"
            echo "Cite docs/KNOWN-ISSUES.md or a docs/ file by repo path, or inline the fact."
            exit 1
          fi
          echo "No out-of-repo spec-section citations in module source."

      - name: Old module name stays gone (rename tripwire)
        shell: bash
        run: |
          # The module was renamed to Taimi's Toolbench before v0.3.0 shipped.
          # The old name is a unique string, so its absence is checkable: this
          # step fails on any case-insensitive occurrence of the old one-word
          # identifier or the old spaced display name, in file contents or in
          # tracked file names. The patterns are assembled from halves so this
          # step never matches itself.
          #
          # Allowlist, and why each entry earns it:
          #   CHANGELOG.md    the 0.3.0 rename entry names what changed - that
          #                   mention is the point of the entry
          #   dev/            dated point-in-time records, frozen by policy
          #   docs/research/  same policy (both trees are already excluded
          #                   from the live-docs path check above)
          a="Crafting"; b="Helper"
          allow='^(dev/|docs/research/|CHANGELOG\.md$)'
          hits=$(git ls-files -z | grep -zvE "$allow" \
            | xargs -0 -r grep -liE "$a$b|$a $b" || true)
          named=$(git ls-files | grep -vE "$allow" | grep -iE "$a.?$b" || true)
          if [ -n "$hits$named" ]; then
            echo "The old module name has crept back in. Rename it, or extend"
            echo "the documented allowlist in this step if it is history."
            [ -n "$hits" ] && { echo "content:"; echo "$hits"; }
            [ -n "$named" ] && { echo "file names:"; echo "$named"; }
            exit 1
          fi
          echo "No stray occurrences of the old module name."

      - name: Relative links in tracked markdown resolve
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          files = subprocess.run(['git', 'ls-files', '*.md'], capture_output=True,
                                 text=True, check=True).stdout.split('\n')
          broken = []
          for f in filter(None, files):
              for target in re.findall(r'\]\(([^)]+)\)', open(f, encoding='utf-8').read()):
                  if target.startswith(('http', 'mailto:', '#')):
                      continue
                  path = target.split('#')[0].replace('%20', ' ')
                  if path and not os.path.exists(os.path.join(os.path.dirname(f), path)):
                      broken.append(f'{f} -> {target}')
          if broken:
              print('Broken relative markdown links:')
              print('\n'.join(broken))
              sys.exit(1)
          print(f'{len(files)} markdown files, no broken relative links.')
          PY

  # 40% of the last 300 commits touched nothing outside docs/. A job skipped by
  # an `if` still reports a status to branch protection, which a workflow-level
  # paths-ignore would not - that would leave docs-only PRs unmergeable.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Anything we cannot resolve falls through to building, never to skipping.
          code=true
          # release.yml calls this workflow on a tag ref and gates publishing on
          # the result. A docs-only skip there would hand the release job a
          # green `tests` status that ran no tests - re-tagging an existing
          # release commit is enough to reach it - which is the exact hole this
          # gate exists to close. Tag refs always run the whole suite.
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "tag ref: running the full suite regardless of what changed"
            exit 0
          fi
          base="$BASE_SHA"
          if [ -z "$base" ]; then
            base="$BEFORE_SHA"
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            merge_base=$(git merge-base "$base" "$GITHUB_SHA" 2>/dev/null || true)
            if [ -n "$merge_base" ]; then
              base="$merge_base"
            fi
            changed=$(git diff --name-only "$base" "$GITHUB_SHA")
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(docs/|.*\.md$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "non-doc changes present: $code"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            packages
            ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('packages.config', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore packages
        run: nuget restore TaimisToolbench.sln

      # The solution, not the module alone: tools/MysticForgeSeeder (the only
      # producer of ref/mystic_forge_recipes.json) and tools/TaimisToolbench.Harness
      # have no test project, so a project-scoped build compiled neither.
      #
      # No -warnaserror here on purpose. The warning gate lives in the project
      # files - TreatWarningsAsErrors in TaimisToolbench.csproj and, through
      # the StyleGate.props import, in every test and tool project - so it
      # applies to a developer's local build too, not just to CI, and this
      # step inherits it for free. Adding the flag here would
      # also widen the gate to every project in the solution, including CI-only
      # restore diagnostics that never appear locally. Note that -warnaserror:CS
      # specifically would do nothing at all: csc honours WarningsAsErrors only
      # for explicit codes, verified by reintroducing a CS0108 under the prefix
      # form and watching the build stay green (see the csproj comment).
      - name: Build solution
        run: dotnet build TaimisToolbench.sln -p:Platform=x64

      - name: Run tests
        run: dotnet test tests/TaimisToolbench.Tests/TaimisToolbench.Tests.csproj -c Release

      - name: Run recipe seeder tests
        run: dotnet test tests/TaimisToolbench.RecipeSeeder.Tests/TaimisToolbench.RecipeSeeder.Tests.csproj -p:Platform=x64 -c Release

      - name: Run vendor offer updater tests
        run: dotnet test tests/VendorOfferUpdater.Tests/VendorOfferUpdater.Tests.csproj -c Release

      # Release|x64 is the configuration release.yml ships from. CI already
      # reaches it, but only as a side effect: the module test step above pulls
      # the module in through a ProjectReference pinned with SetPlatform=x64,
      # so BuildBlishHUDModule runs because a test project happened to ask for
      # it. That coverage vanishes silently the day SetPlatform changes or the
      # test project stops referencing the module. Build it by name and assert
      # the .bhm came out, so the artefact players install is a thing CI checks
      # on purpose rather than a thing it happens to produce.
      - name: Build the shipping configuration (Release/x64)
        run: dotnet build TaimisToolbench.csproj -p:Platform=x64 -c Release

      - name: Verify the .bhm was produced
        shell: bash
        run: |
          test -f bin/x64/Release/TaimisToolbench.bhm
          ls -l bin/x64/Release/TaimisToolbench.bhm
